services:
  - type: web
    name: loki-auth
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - { key: NODE_VERSION, value: 22.13.0 }
      - { key: NODE_ENV, value: production }
      - { key: HOST, value: 0.0.0.0 }
      - { key: DB_DRIVER, value: turso }
      - { key: APP_SECRET, generateValue: true }
      - { key: TURSO_URL, sync: false }
      - { key: TURSO_TOKEN, sync: false }
      - { key: DEMO_TTL_MS, value: "1800000" }
      - { key: EMAIL_PROVIDER, value: none }
